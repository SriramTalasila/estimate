<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimate Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [v-cloak] { display: none; }
        .fade-enter-active, .fade-leave-active { transition: opacity 0.2s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
        
        /* Custom scrollbar for tables */
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px;}
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @media print {
            body { background-color: white; }
            header, nav, .print-hide { display: none !important; }
            main { padding: 0 !important; max-width: 100% !important; margin: 0 !important; }
            .shadow-sm { box-shadow: none !important; }
            .border { border-color: #e5e7eb !important; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen">

<div id="app" v-cloak class="min-h-screen flex flex-col">
    
    <!-- Full Screen Loader for Initial Session Check -->
    <div v-if="isInitializing" class="flex-1 flex flex-col items-center justify-center bg-gray-50">
        <i data-lucide="loader-2" class="w-12 h-12 animate-spin text-blue-600 mb-4"></i>
        <h2 class="text-2xl font-bold text-gray-900 tracking-tight">EstiMate</h2>
        <p class="text-sm text-gray-500 mt-2 font-medium">Verifying session...</p>
    </div>

    <!-- Main App Wrapper (Loads after auth check) -->
    <template v-else>
        <!-- Confirm Modal -->
        <div v-if="confirmDialog.isOpen" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4 print-hide">
            <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden transform transition-all">
                <div class="p-6">
                    <div class="flex items-center gap-3 text-red-600 mb-4">
                        <div class="p-2 bg-red-50 rounded-full"><i data-lucide="alert-triangle" class="w-6 h-6"></i></div>
                        <h3 class="text-lg font-bold text-gray-900">{{ confirmDialog.title }}</h3>
                    </div>
                    <p class="text-sm text-gray-500">{{ confirmDialog.message }}</p>
                </div>
                <div class="px-6 py-4 bg-gray-50 flex justify-end gap-3">
                    <button @click="closeConfirm" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-100 transition-colors">Cancel</button>
                    <button @click="confirmAction" class="px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-medium hover:bg-red-700 transition-colors shadow-sm">Confirm</button>
                </div>
            </div>
        </div>

        <!-- Navbar -->
        <header class="bg-white border-b border-gray-200 sticky top-0 z-20 shadow-sm print-hide">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2 cursor-pointer" @click="view = isAuthenticated ? 'dashboard' : 'auth'">
                    <div class="bg-blue-600 p-1.5 rounded-lg">
                        <i data-lucide="file-text" class="text-white w-5 h-5"></i>
                    </div>
                    <h1 class="text-xl font-semibold text-gray-900 tracking-tight">EstiMate</h1>
                </div>
                
                <div class="flex items-center gap-4">
                    <div class="flex items-center text-sm font-medium" :class="isDemoMode ? 'text-amber-500' : 'text-emerald-500'">
                        <span class="relative flex h-2.5 w-2.5 mr-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75" :class="isDemoMode ? 'bg-amber-400' : 'bg-emerald-400'"></span>
                            <span class="relative inline-flex rounded-full h-2.5 w-2.5" :class="isDemoMode ? 'bg-amber-500' : 'bg-emerald-500'"></span>
                        </span>
                        <span class="hidden sm:inline">{{ isDemoMode ? 'Demo Mode' : 'Live API' }}</span>
                    </div>
                    
                    <button @click="toggleSettings" class="p-2 text-gray-500 hover:text-gray-900 hover:bg-gray-100 rounded-full transition-colors" title="API Settings">
                        <i data-lucide="server" class="w-5 h-5"></i>
                    </button>
                    
                    <button v-if="isAuthenticated" @click="logout()" class="text-sm font-medium text-gray-600 hover:text-red-600 transition-colors flex items-center gap-1">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">Sign Out</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Sub Navigation Tabs (When Authenticated) -->
        <div v-if="isAuthenticated && view !== 'estimate-form'" class="bg-white border-b border-gray-200 shadow-sm print-hide">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <nav class="flex space-x-8 overflow-x-auto custom-scrollbar">
                    <button @click="currentTab = 'estimates'" :class="currentTab === 'estimates' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'" class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors">
                        Estimates
                    </button>
                    <button @click="currentTab = 'catalog'" :class="currentTab === 'catalog' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'" class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors" :disabled="!hasBusinessProfile" :title="!hasBusinessProfile ? 'Create a business profile first' : ''">
                        Catalog (Products & Categories)
                    </button>
                    <button @click="currentTab = 'profile'" :class="currentTab === 'profile' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'" class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors flex items-center gap-2">
                        Business Profile
                        <i v-if="!hasBusinessProfile" data-lucide="alert-circle" class="w-4 h-4 text-amber-500"></i>
                    </button>
                </nav>
            </div>
        </div>

        <!-- Main Content -->
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            
            <!-- API Settings Modal -->
            <div v-if="showSettings" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 print-hide">
                <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden transform transition-all">
                    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                        <h3 class="text-lg font-semibold text-gray-900">API Configuration</h3>
                        <button @click="showSettings = false" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="p-6 space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Base API URL</label>
                            <input v-model="apiBaseUrl" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow text-sm">
                        </div>
                        <div class="flex items-center p-3 rounded-lg border" :class="(isAuthenticated && !isAdmin) ? 'bg-gray-50 border-gray-200 opacity-60' : 'bg-blue-50 border-blue-100'">
                            <input type="checkbox" id="demoToggle" v-model="isDemoMode" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" :disabled="isAuthenticated && !isAdmin">
                            <label for="demoToggle" class="ml-2 block text-sm font-medium" :class="(isAuthenticated && !isAdmin) ? 'text-gray-500' : 'text-blue-800'">
                                Enable Demo Mode (Mock API)
                            </label>
                        </div>
                        <p v-if="isAuthenticated && !isAdmin" class="text-xs text-red-500 mt-1 font-medium">Demo mode is restricted to Admin users.</p>
                        <p v-else class="text-xs text-gray-500 mt-1">Demo mode allows you to interact with the UI without needing a live backend server.</p>
                    </div>
                    <div class="px-6 py-4 bg-gray-50 flex justify-end">
                        <button @click="showSettings = false" class="px-4 py-2 bg-gray-900 text-white rounded-lg text-sm font-medium hover:bg-gray-800 transition-colors">Done</button>
                    </div>
                </div>
            </div>

            <!-- Auth View -->
            <transition name="fade" mode="out-in">
                <div v-if="view === 'auth'" key="auth" class="max-w-md mx-auto mt-12 bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="flex border-b border-gray-200">
                        <button @click="authMode = 'login'" :class="authMode === 'login' ? 'bg-white text-blue-600 border-b-2 border-blue-600' : 'bg-gray-50 text-gray-500 hover:text-gray-700'" class="flex-1 py-4 text-sm font-semibold transition-colors">Sign In</button>
                        <button @click="authMode = 'signup'" :class="authMode === 'signup' ? 'bg-white text-blue-600 border-b-2 border-blue-600' : 'bg-gray-50 text-gray-500 hover:text-gray-700'" class="flex-1 py-4 text-sm font-semibold transition-colors border-l border-gray-200">Sign Up</button>
                    </div>
                    <div class="px-8 py-8">
                        <!-- Login Form -->
                        <form v-if="authMode === 'login'" @submit.prevent="login" class="space-y-5">
                            <div class="text-center mb-6">
                                <h2 class="text-2xl font-bold text-gray-900">Welcome Back</h2>
                                <p class="text-sm text-gray-500 mt-1">Sign in to manage your estimates</p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                                <input v-model="credentials.username" type="text" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                <input v-model="credentials.password" type="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow">
                            </div>
                            <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors flex justify-center items-center gap-2" :disabled="loading">
                                <i v-if="loading" data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
                                {{ loading ? 'Processing...' : 'Sign In' }}
                            </button>
                        </form>

                        <!-- Signup Form -->
                        <form v-else @submit.prevent="signup" class="space-y-5">
                            <div class="text-center mb-6">
                                <h2 class="text-2xl font-bold text-gray-900">Create Account</h2>
                                <p class="text-sm text-gray-500 mt-1">Register to start creating estimates</p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                                <input v-model="signupData.username" type="text" required minlength="3" maxlength="20" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                <input v-model="signupData.email" type="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                <input v-model="signupData.password" type="password" required minlength="6" maxlength="40" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow">
                            </div>
                            <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors flex justify-center items-center gap-2" :disabled="loading">
                                <i v-if="loading" data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
                                {{ loading ? 'Processing...' : 'Create Account' }}
                            </button>
                        </form>
                        
                        <div v-if="errorMsg" class="mt-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg border border-red-100 flex items-start gap-2">
                            <i data-lucide="alert-circle" class="w-4 h-4 mt-0.5 shrink-0"></i>
                            <span>{{ errorMsg }}</span>
                        </div>
                        <div v-if="successMsg" class="mt-4 p-3 bg-green-50 text-green-700 text-sm rounded-lg border border-green-100 flex items-start gap-2">
                            <i data-lucide="check-circle" class="w-4 h-4 mt-0.5 shrink-0"></i>
                            <span>{{ successMsg }}</span>
                        </div>
                    </div>
                </div>

                <!-- Dashboard View -->
                <div v-else-if="view === 'dashboard'" key="dashboard" class="space-y-6">

                    <!-- Alert for Missing Business Profile -->
                    <div v-if="!hasBusinessProfile && currentTab !== 'profile'" class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-lg shadow-sm">
                        <div class="flex">
                            <div class="flex-shrink-0"><i data-lucide="alert-triangle" class="h-5 w-5 text-amber-500"></i></div>
                            <div class="ml-3">
                                <p class="text-sm text-amber-700 font-medium">You need to set up your Business Profile before you can manage products or create estimates.</p>
                                <p class="mt-2 text-sm"><button @click="currentTab = 'profile'" class="font-medium text-amber-700 hover:text-amber-600 underline">Set up profile now &rarr;</button></p>
                            </div>
                        </div>
                    </div>

                    <!-- 1. Estimates Tab -->
                    <div v-if="currentTab === 'estimates' && hasBusinessProfile">
                        
                        <!-- Mini Dashboard -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex items-center gap-4">
                                <div class="p-3 bg-blue-50 text-blue-600 rounded-lg"><i data-lucide="calendar" class="w-6 h-6"></i></div>
                                <div>
                                    <p class="text-sm text-gray-500 font-medium">Today's Total</p>
                                    <h3 class="text-xl font-bold text-gray-900">{{ formatCurrency(dashboardStats.today) }}</h3>
                                </div>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex items-center gap-4">
                                <div class="p-3 bg-emerald-50 text-emerald-600 rounded-lg"><i data-lucide="bar-chart-2" class="w-6 h-6"></i></div>
                                <div>
                                    <p class="text-sm text-gray-500 font-medium">This Month</p>
                                    <h3 class="text-xl font-bold text-gray-900">{{ formatCurrency(dashboardStats.month) }}</h3>
                                </div>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex items-center gap-4">
                                <div class="p-3 bg-indigo-50 text-indigo-600 rounded-lg"><i data-lucide="trending-up" class="w-6 h-6"></i></div>
                                <div>
                                    <p class="text-sm text-gray-500 font-medium">This Year</p>
                                    <h3 class="text-xl font-bold text-gray-900">{{ formatCurrency(dashboardStats.year) }}</h3>
                                </div>
                            </div>
                        </div>

                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                            <div>
                                <h2 class="text-2xl font-bold text-gray-900">Estimates</h2>
                            </div>
                            <div class="flex flex-col sm:flex-row gap-3">
                                <div class="relative">
                                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                    <input v-model="searchQuery" type="text" placeholder="Search estimates..." class="pl-9 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm w-full sm:w-64 transition-shadow">
                                </div>
                                <button @click="openCreateForm" class="shrink-0 inline-flex items-center justify-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700 transition-colors shadow-sm">
                                    <i data-lucide="plus" class="w-4 h-4"></i> New Estimate
                                </button>
                            </div>
                        </div>

                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                            <div v-if="loading" class="p-12 flex justify-center"><i data-lucide="loader-2" class="w-8 h-8 animate-spin text-blue-600"></i></div>
                            
                            <div v-else-if="filteredEstimates.length === 0" class="p-12 text-center text-gray-500">
                                <div class="bg-gray-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <i data-lucide="inbox" class="w-8 h-8 text-gray-400"></i>
                                </div>
                                <p class="text-lg font-medium text-gray-900 mb-1">No estimates found</p>
                                <p class="text-sm mb-4" v-if="searchQuery">We couldn't find any estimates matching "{{ searchQuery }}".</p>
                                <p class="text-sm mb-4" v-else>Create your first estimate to get started.</p>
                            </div>

                            <div v-else class="overflow-x-auto custom-scrollbar">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-gray-50 border-b border-gray-200 text-xs uppercase tracking-wider text-gray-500 font-semibold">
                                            <th class="px-6 py-4">Estimate #</th>
                                            <th class="px-6 py-4">Customer</th>
                                            <th class="px-6 py-4 text-right">Total</th>
                                            <th class="px-6 py-4 text-right">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100 text-sm">
                                        <tr v-for="est in filteredEstimates" :key="est.id" class="hover:bg-gray-50 transition-colors">
                                            <td class="px-6 py-4 font-medium text-gray-900">{{ est.estimateNumber || 'EST-00' + est.id }}</td>
                                            <td class="px-6 py-4">
                                                <div class="text-gray-900 font-medium">{{ est.customerName || 'Walk-in Customer' }}</div>
                                                <div class="text-gray-500 text-xs">{{ est.customerPhone }}</div>
                                            </td>
                                            <td class="px-6 py-4 text-right font-medium text-gray-900">{{ formatCurrency(est.finalTotal) }}</td>
                                            <td class="px-6 py-4 text-right print-hide">
                                                <div class="flex items-center justify-end gap-3">
                                                    <button @click="shareEstimate(est)" class="text-gray-400 hover:text-green-500 transition-colors" title="Share via WhatsApp">
                                                        <i data-lucide="message-circle" class="w-4 h-4"></i>
                                                    </button>
                                                    <button @click="printEstimate(est)" class="text-gray-400 hover:text-emerald-600 transition-colors" title="Print/Download PDF">
                                                        <i data-lucide="printer" class="w-4 h-4"></i>
                                                    </button>
                                                    <button @click="openEditForm(est)" class="text-gray-400 hover:text-blue-600 transition-colors" title="Edit">
                                                        <i data-lucide="edit-2" class="w-4 h-4"></i>
                                                    </button>
                                                    <button @click="deleteEstimate(est.id)" class="text-gray-400 hover:text-red-600 transition-colors" title="Delete">
                                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- 2. Catalog (Products & Categories) Tab -->
                    <div v-if="currentTab === 'catalog' && hasBusinessProfile" class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                        <!-- Categories Sidebar -->
                        <div class="lg:col-span-1 space-y-4">
                            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col h-[600px]">
                                <div class="p-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                                    <h3 class="font-bold text-gray-900 text-sm uppercase tracking-wider">Categories</h3>
                                </div>
                                <div class="p-3 border-b border-gray-100">
                                    <form @submit.prevent="createCategory" class="flex gap-2">
                                        <input v-model="newCategoryName" type="text" placeholder="New Category..." required class="w-full px-3 py-1.5 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm">
                                        <button type="submit" class="bg-gray-900 text-white px-3 py-1.5 rounded hover:bg-gray-800" :disabled="loadingCat"><i data-lucide="plus" class="w-4 h-4"></i></button>
                                    </form>
                                </div>
                                <div class="overflow-y-auto flex-1 p-2 space-y-1 custom-scrollbar">
                                    <div v-if="categories.length === 0" class="text-xs text-gray-500 p-2 text-center">No categories yet.</div>
                                    <button v-for="cat in categories" :key="cat.id" @click="selectCategory(cat)" :class="selectedCategoryId === cat.id ? 'bg-blue-50 text-blue-700 font-semibold border-blue-200' : 'text-gray-600 hover:bg-gray-50 border-transparent'" class="w-full text-left px-3 py-2 rounded-md text-sm transition-colors border">
                                        {{ cat.name }}
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Products Area -->
                        <div class="lg:col-span-3">
                            <div class="bg-white rounded-xl shadow-sm border border-gray-200 h-[600px] flex flex-col">
                                <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                                    <h3 class="font-bold text-gray-900 text-sm uppercase tracking-wider">
                                        Products <span v-if="selectedCategoryName" class="text-blue-600 lowercase tracking-normal">in {{ selectedCategoryName }}</span>
                                    </h3>
                                    <button v-if="selectedCategoryId" @click="showAddProduct = true" class="text-xs bg-white border border-gray-300 shadow-sm px-3 py-1.5 rounded-md font-medium text-gray-700 hover:bg-gray-50 transition-colors flex items-center gap-1">
                                        <i data-lucide="plus" class="w-3 h-3"></i> Add Product
                                    </button>
                                </div>

                                <div v-if="!selectedCategoryId" class="flex-1 flex items-center justify-center text-gray-400 p-6 text-center">
                                    <div>
                                        <i data-lucide="folder-open" class="w-12 h-12 mx-auto mb-3 opacity-50"></i>
                                        <p>Select a category from the left to view its products.</p>
                                    </div>
                                </div>
                                
                                <div v-else class="flex-1 overflow-auto custom-scrollbar p-0">
                                    <!-- Add Product Inline Form -->
                                    <div v-if="showAddProduct" class="p-4 bg-blue-50/50 border-b border-gray-200 flex gap-3 items-end">
                                        <div class="flex-1">
                                            <label class="block text-xs font-medium text-gray-600 mb-1">Name</label>
                                            <input v-model="newProduct.name" type="text" class="w-full px-3 py-2 border border-gray-300 rounded text-sm outline-none focus:border-blue-500">
                                        </div>
                                        <div class="w-24">
                                            <label class="block text-xs font-medium text-gray-600 mb-1">Price</label>
                                            <input v-model.number="newProduct.price" type="number" step="0.01" class="w-full px-3 py-2 border border-gray-300 rounded text-sm outline-none focus:border-blue-500">
                                        </div>
                                        <div class="w-24">

        items: [{ id: 1, productId: 1, productName: 'Web Development Service', unit: 'Project', quantity: 1, unitPrice: 1500, discount: 0, subtotal: 1500 },
                { id: 2, productId: 2, productName: 'SEO Optimization', unit: 'Month', quantity: 1, unitPrice: 300, discount: 0, subtotal: 300 }],

    }
];

createApp({
    setup() {
        // App State
        const isInitializing = ref(true); // Added for session check
        const isDemoMode = ref(false); // Default to Live Server
        const showSettings = ref(false);
        const apiBaseUrl = ref(window.location.origin); // Switched to window origin
        const view = ref('auth'); // 'auth', 'dashboard', 'estimate-form'
        const authMode = ref('login'); // 'login', 'signup'
        const currentTab = ref('estimates'); // 'estimates', 'catalog', 'profile'
        
        const loading = ref(false);
        const loadingCat = ref(false);
        const loadingProd = ref(false);
        const saving = ref(false);
        const errorMsg = ref('');
        const successMsg = ref('');
        const isAuthenticated = ref(false);
        
        const userRoles = ref([]);
        const isAdmin = computed(() => {
            if (!userRoles.value || !Array.isArray(userRoles.value)) return false;
            return userRoles.value.some(r => typeof r === 'string' && r.toUpperCase().includes('ADMIN'));
        });

        // Confirm Dialog State
        const confirmDialog = ref({ isOpen: false, title: '', message: '', onConfirm: null });

        // Data Models
        const credentials = ref({ username: '', password: '' });
        const signupData = ref({ username: '', email: '', password: '' });
        
        const businessInfo = ref(null);
        const hasBusinessProfile = computed(() => businessInfo.value && businessInfo.value.id);
        const businessFormData = ref({ shopName: '', shopAddress: '', phone: '', gstNumber: '', logo: null });
        const isEditingProfile = ref(false);

        const estimates = ref([]);
        const serverStats = ref({ today: 0, month: 0, year: 0 });
        const searchQuery = ref('');
        const categories = ref([]);
        const products = ref([]); // Products for currently selected category
        const availableProducts = ref([]); // All flat products needed for estimate dropdown
        
        // Catalog State
        const selectedCategoryId = ref(null);
        const newCategoryName = ref('');
        const showAddProduct = ref(false);
        const newProduct = ref({ name: '', price: 0, unit: '' });
        
        const selectedCategoryName = computed(() => {
            if(!selectedCategoryId.value) return '';
            const c = categories.value.find(c => c.id === selectedCategoryId.value);
            return c ? c.name : '';
        });

        // Group available products by category for the select dropdown
        const groupedAvailableProducts = computed(() => {
            const groups = {};
            availableProducts.value.forEach(p => {
                const catName = p.categoryName || 'Uncategorized';
                if (!groups[catName]) groups[catName] = [];
                groups[catName].push(p);
            });
            return groups;
        });

        // Filter categories strictly to what's added in the line items
        const activeCategoriesInItems = computed(() => {
            const catIds = new Set();
            formData.value.items.forEach(item => {
                if (item.productId) {
                    const p = availableProducts.value.find(x => x.id === item.productId);
                    if (p && p.categoryId) catIds.add(p.categoryId);
                }
            });
            return categories.value.filter(c => catIds.has(c.id));
        });

        // Estimate Form Data
        const formMode = ref('create'); 
        const getEmptyForm = () => ({
            id: null, customerId: null, customerName: '', customerPhone: '', additionalDiscount: 0, additionalDiscountType: 'FLAT', taxAmount: 0,
            items: [{ productId: '', quantity: 1, unitPrice: 0, discount: 0, discountType: 'FLAT', overrideCategoryDiscount: false }],
            notes: [], categoryDiscounts: []
        });
        const formData = ref(getEmptyForm());

        const getCategoryDiscountForProduct = (productId) => {
            const p = availableProducts.value.find(x => x.id === productId);
            if(!p) return null;
            return formData.value.categoryDiscounts.find(cd => cd.categoryId === p.categoryId);
        };

        const hasActiveCategoryDiscount = (item) => {
            if(!item.productId) return false;
            const catDisc = getCategoryDiscountForProduct(item.productId);
            return catDisc && catDisc.discount > 0;
        };

        // Computed Totals for Estimate
        const totals = computed(() => {
            let subtotal = 0; let itemDiscounts = 0;
            formData.value.items.forEach(item => {
                if(!item.productId || !item.quantity || !item.unitPrice) return;
                let lineTotal = item.quantity * item.unitPrice;
                subtotal += lineTotal;
                
                let appliedDisc = 0;
                let appliedType = 'FLAT';
                const catDisc = getCategoryDiscountForProduct(item.productId);

                if(catDisc && !item.overrideCategoryDiscount) {
                    appliedDisc = catDisc.discount;
                    appliedType = catDisc.discountType;
                } else if(item.discount > 0) {
                    appliedDisc = item.discount;
                    appliedType = item.discountType;
                }

                let lineDiscount = 0;
                if(appliedDisc > 0) {
                    lineDiscount = appliedType === 'PERCENTAGE' ? lineTotal * (appliedDisc / 100) : appliedDisc;
                }
                itemDiscounts += lineDiscount;
            });
            let amountAfterItemDisc = Math.max(0, subtotal - itemDiscounts);
            let addDiscVal = formData.value.additionalDiscount > 0 ? (formData.value.additionalDiscountType === 'PERCENTAGE' ? amountAfterItemDisc * (formData.value.additionalDiscount / 100) : formData.value.additionalDiscount) : 0;
            let finalAmount = Math.max(0, amountAfterItemDisc - addDiscVal) + (formData.value.taxAmount || 0);
            return { subtotal, itemDiscounts, additionalDiscountValue: addDiscVal, totalDiscount: itemDiscounts + addDiscVal, finalAmount };
        });

        // Dashboard Stats & Search Filters
        const dashboardStats = computed(() => {
            if (!isDemoMode.value && hasBusinessProfile.value) {
                return serverStats.value;
            }
            
            let today = 0, month = 0, year = 0;
            const now = new Date();
            
            estimates.value.forEach(est => {
                if(!est.createdAt) return;
                const estDate = new Date(est.createdAt);
                if (isNaN(estDate)) return;
                
                const isSameYear = estDate.getFullYear() === now.getFullYear();
                const isSameMonth = isSameYear && estDate.getMonth() === now.getMonth();
                const isSameDay = isSameMonth && estDate.getDate() === now.getDate();

                if (isSameDay) today += est.finalTotal;
                if (isSameMonth) month += est.finalTotal;
                if (isSameYear) year += est.finalTotal;
            });
            return { today, month, year };
        });

        const filteredEstimates = computed(() => {
            if(!searchQuery.value) return estimates.value;
            const q = searchQuery.value.toLowerCase();
            return estimates.value.filter(e => 
                (e.estimateNumber && e.estimateNumber.toLowerCase().includes(q)) ||
                (e.customerName && e.customerName.toLowerCase().includes(q)) ||
                (e.customerPhone && e.customerPhone.toLowerCase().includes(q))
            );
        });

        const calculateRowTotal = (item) => {
            if(!item.quantity || !item.unitPrice) return 0;
            let total = item.quantity * item.unitPrice;
            
            let appliedDisc = 0;
            let appliedType = 'FLAT';
            const catDisc = getCategoryDiscountForProduct(item.productId);

            if(catDisc && !item.overrideCategoryDiscount) {
                appliedDisc = catDisc.discount;
                appliedType = catDisc.discountType;
            } else if(item.discount > 0) {
                appliedDisc = item.discount;
                appliedType = item.discountType;
            }

            if(appliedDisc > 0) total -= appliedType === 'PERCENTAGE' ? total * (appliedDisc / 100) : appliedDisc;
            return Math.max(0, total);
        };

        // Utilities
        const toggleSettings = () => showSettings.value = !showSettings.value;
        const formatCurrency = (val) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(val || 0);
        const formatDate = (dateStr) => dateStr ? new Intl.DateTimeFormat('en-US', { year: 'numeric', month: 'short', day: 'numeric' }).format(new Date(dateStr)) : '';
        
        // SAFE Icon renderer - Prevents lucide.createIcons from destroying elements Vue is tracking
        const updateIcons = () => { 
            if(!window.lucide) return;
            const elements = document.querySelectorAll('[data-lucide]:not([data-icon-rendered])');
            if(elements.length === 0) return;
            
            elements.forEach(el => {
                const name = el.getAttribute('data-lucide');
                const camelName = name.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');
                const iconData = window.lucide.icons[camelName];
                if (iconData) {
                    const svg = window.lucide.createElement(iconData);
                    // Make SVG fill the container
                    svg.setAttribute('width', '100%');
                    svg.setAttribute('height', '100%');
                    svg.removeAttribute('class'); // Prevent CSS conflicts
                    // Safely insert HTML without destroying the parent element Vue tracks
                    el.innerHTML = svg.outerHTML;
                    el.setAttribute('data-icon-rendered', 'true');
                    el.style.display = 'inline-flex';
                    el.style.alignItems = 'center';
                    el.style.justifyContent = 'center';
                }
            });
        };

        const showMessage = (msg, isError = false) => {
            errorMsg.value = isError ? msg : '';
            successMsg.value = !isError ? msg : '';
            setTimeout(() => { errorMsg.value = ''; successMsg.value = ''; }, 4000);
        };

        const openConfirm = (title, message, onConfirmCallback) => {
            confirmDialog.value = { isOpen: true, title, message, onConfirm: onConfirmCallback };
        };
        
        const closeConfirm = () => { confirmDialog.value.isOpen = false; };
        
        const confirmAction = () => {
            if (confirmDialog.value.onConfirm) confirmDialog.value.onConfirm();
            closeConfirm();
        };

        let refreshTokenPromise = null;

        const tryRefreshToken = async () => {
            if (isDemoMode.value) return false;
            if (!refreshTokenPromise) {
                refreshTokenPromise = (async () => {
                    try {
                        const refreshRes = await fetch(`${apiBaseUrl.value}/api/auth/refresh-token`, {
                            method: 'POST',
                            credentials: 'include'
                        });
                        return refreshRes.ok;
                    } catch (e) {
                        return false;
                    } finally {
                        refreshTokenPromise = null;
                    }
                })();
            }
            return refreshTokenPromise;
        };

        const authenticatedFetch = async (endpoint, options = {}, retryOnUnauthorized = true) => {
            const headers = { ...(options.headers || {}) };
            if (options.body !== undefined && !headers['Content-Type']) {
                headers['Content-Type'] = 'application/json';
            }

            const response = await fetch(`${apiBaseUrl.value}${endpoint}`, {
                ...options,
                credentials: 'include',
                headers
            });

            if (response.status === 401 && retryOnUnauthorized) {
                const refreshed = await tryRefreshToken();
                if (refreshed) {
                    return authenticatedFetch(endpoint, options, false);
                }

                logout(true);
                throw new Error("Session expired.");
            }

            return response;
        };

        // HTTP Wrapper
        const apiFetch = async (endpoint, options = {}) => {
            if(isDemoMode.value) return null; // Demo interception handled directly in actions
            try {
                const res = await authenticatedFetch(endpoint, options);
                if(!res.ok) {
                    const err = await res.json().catch(()=>({}));
                    throw new Error(err.description || err.message || `HTTP Error ${res.status}`);
                }
                const text = await res.text();
                return text ? JSON.parse(text) : {};
            } catch(e) { throw e; }
        };

        // --- SESSION VERIFICATION ---
        const checkSession = async () => {
            if (isDemoMode.value) {
                isInitializing.value = false;
                return;
            }
            try {
                await loadBusinessProfile();
                isAuthenticated.value = true;
                view.value = 'dashboard';
            } catch (e) {
                // If it fails (like 401 Unauthorized), we safely fall back to auth view
                isAuthenticated.value = false;
                view.value = 'auth';
            } finally {
                isInitializing.value = false;
            }
        };

        // --- AUTHENTICATION ---
        const signup = async () => {
            loading.value = true; errorMsg.value = ''; successMsg.value = '';
            try {
                if(isDemoMode.value) await new Promise(r => setTimeout(r, 600));
                else await apiFetch('/api/auth/signup', { method: 'POST', body: JSON.stringify(signupData.value) });
                showMessage("Account created successfully. You can now sign in.");
                authMode.value = 'login';
                credentials.value.username = signupData.value.username;
            } catch(e) { errorMsg.value = e.message || "Failed to sign up."; }
            finally { loading.value = false; }
        };

        const login = async () => {
            loading.value = true; errorMsg.value = '';
            try {
                if(isDemoMode.value) {
                    await new Promise(r => setTimeout(r, 600));
                    isAuthenticated.value = true;
                    userRoles.value = ['ROLE_ADMIN']; // Mock as admin for demo
                    businessInfo.value = { id: 99, shopName: "Demo Shop", phone: "555-1234", logo: null };
                    businessFormData.value = { ...businessInfo.value };
                    view.value = 'dashboard';
                    await loadEstimates();
                } else {
                    const res = await apiFetch('/api/auth/signin', { method: 'POST', body: JSON.stringify(credentials.value) });
                    isAuthenticated.value = true;
                    // Extract roles based on standard Spring Boot / JSON patterns
                    userRoles.value = res.roles || res.role || (res.authorities ? res.authorities.map(a => a.authority) : []) || [];
                    
                    // Force live mode if the user is not an Admin
                    if (!isAdmin.value) {
                        isDemoMode.value = false;
                    }
                    
                    await loadBusinessProfile();
                    
                    if (isAuthenticated.value) {
                        view.value = 'dashboard';
                    }
                }
            } catch(e) { 
                errorMsg.value = e.message === "Session expired." 
                    ? "Login succeeded, but requests were blocked. Check your browser CORS/Cookie settings." 
                    : "Invalid credentials or network error."; 
            }
            finally { loading.value = false; }
        };

        const logout = async (skipApiCall = false) => {
            if (!isDemoMode.value && skipApiCall !== true) {
                try { 
                    await fetch(`${apiBaseUrl.value}/api/auth/signout`, { method: 'POST', credentials: 'include' }); 
                } catch(e) {}
            }
            isAuthenticated.value = false; 
            view.value = 'auth';

            userRoles.value = [];

                estimates.value = fetchedEstimates || [];
                
                const stats = await apiFetch(`/api/business/${businessInfo.value.id}/estimates/stats`);
                serverStats.value = {
                    today: stats.today || stats.Today || 0,
                    month: stats.month || stats.Month || stats.thisMonth || 0,

                };

        // --- BUSINESS PROFILE ---

                    const res = await apiFetch(`/api/manage/business/${businessInfo.value.id}`, { method: 'PUT', body: JSON.stringify(payload) });
                    businessInfo.value = { ...res, logo: payload.logo }; // Optimistically keep logo if backend strips it
                } else {
                    const res = await apiFetch(`/api/manage/business`, { method: 'POST', body: JSON.stringify(payload) });
                    businessInfo.value = { ...res, logo: payload.logo }; // Optimistically keep logo
                }
                showMessage("Business profile saved!");
                isEditingProfile.value = false;
            } catch(e) { errorMsg.value = e.message || "Failed to save profile."; }
            finally { loading.value = false; }
        };

        // --- CATALOG (Categories & Products) ---
        const loadCategories = async () => {
            if(!hasBusinessProfile.value) return;
            if(isDemoMode.value) { categories.value = [...MOCK_CATEGORIES]; return; }
            try {
                categories.value = await apiFetch(`/api/manage/business/${businessInfo.value.id}/categories`);
            } catch(e) { console.error("Failed to load categories", e); }

            try {
                if(isDemoMode.value) {

                    const newCat = { id: Date.now(), name: newCategoryName.value };
                    MOCK_CATEGORIES.push(newCat); categories.value.push(newCat);
                } else {
                    const res = await apiFetch(`/api/manage/business/${businessInfo.value.id}/categories`, {
                        method: 'POST', body: JSON.stringify({ name: newCategoryName.value })
                    });
                    categories.value.push(res);
                }
                newCategoryName.value = '';
            } catch(e) { showMessage("Failed to add category.", true); }
            finally { loadingCat.value = false; }
        };

            if(isDemoMode.value) {
                products.value = MOCK_PRODUCTS.filter(p => p.categoryId === cat.id);

            try { products.value = await apiFetch(`/api/manage/categories/${cat.id}/products`); }
            catch(e) { products.value = []; }

                    const prod = { id: Date.now(), categoryId: selectedCategoryId.value, ...newProduct.value };
                    MOCK_PRODUCTS.push(prod); products.value.push(prod);

                    const res = await apiFetch(`/api/manage/categories/${selectedCategoryId.value}/products`, {
                        method: 'POST', body: JSON.stringify(newProduct.value)
                    });
                    products.value.push(res);
                }
                newProduct.value = { name: '', price: 0, unit: '' }; showAddProduct.value = false;
            } catch(e) { showMessage("Failed to add product.", true); }
            finally { loadingProd.value = false; }
        };

            openConfirm("Delete Product", "Are you sure you want to delete this product? This action cannot be undone.", async () => {
                try {
                    if(isDemoMode.value) { 
                        MOCK_PRODUCTS = MOCK_PRODUCTS.filter(p => p.id !== id); 
                        products.value = products.value.filter(p => p.id !== id); 
                        return; 
                    }
                    await apiFetch(`/api/manage/products/${id}`, { method: 'DELETE' });
                    products.value = products.value.filter(p => p.id !== id);
                } catch(e) { showMessage("Failed to delete.", true); }
            });
        };

        const loadAllProductsForEstimates = async () => {
            if(!hasBusinessProfile.value) return;
            if(isDemoMode.value) {
                availableProducts.value = MOCK_PRODUCTS.map(p => {
                    const cat = MOCK_CATEGORIES.find(c => c.id === p.categoryId);
                    return { ...p, categoryName: cat ? cat.name : 'Unknown' };
                });
                return;
            }
            try {
                const cats = categories.value.length > 0 ? categories.value : await apiFetch(`/api/manage/business/${businessInfo.value.id}/categories`);
                categories.value = cats; // Cache it
                let all = [];
                for(const cat of cats) {
                    const prods = await apiFetch(`/api/manage/categories/${cat.id}/products`);
                    all.push(...prods.map(p => ({ ...p, categoryId: cat.id, categoryName: cat.name })));
                }
                availableProducts.value = all;
            } catch(e) { console.error("Failed loading full catalog for estimates"); }
        };

        // Tab Watcher
        watch(currentTab, (newTab) => {
            if(newTab === 'catalog') { loadCategories(); selectedCategoryId.value = null; products.value = []; }
        });

        // --- ESTIMATE MANAGEMENT ---
        const openCreateForm = async () => {

            formMode.value = 'create'; formData.value = getEmptyForm(); errorMsg.value = ''; view.value = 'estimate-form';
        };

            await loadAllProductsForEstimates();

            formData.value = {
                id: est.id, customerId: est.customerId, customerName: est.customerName || '', customerPhone: est.customerPhone || '',

                additionalDiscountType: est.additionalDiscountType || 'FLAT',
                items: est.items.map(i => ({
                    productId: i.productId, quantity: i.quantity, unitPrice: i.unitPrice, discount: i.discount || 0, discountType: i.discountType || 'FLAT', overrideCategoryDiscount: i.overrideCategoryDiscount || false
                })),

            };

        };

        const addNote = () => formData.value.notes.push({ note: '' });
        const removeNote = (idx) => formData.value.notes.splice(idx, 1);
        const addCategoryDiscount = () => formData.value.categoryDiscounts.push({ categoryId: '', discount: 0, discountType: 'PERCENTAGE' });

        const onProductSelect = (item) => { const p = availableProducts.value.find(x => x.id === item.productId); if(p) item.unitPrice = p.price; };

        const saveEstimate = async (shouldPrint = false) => {
            errorMsg.value = '';
            const validItems = formData.value.items.filter(i => i.productId && i.quantity > 0);
            if(validItems.length === 0) { errorMsg.value = "Please add at least one valid item."; return; }
            saving.value = true;
            
            const payload = {
                customerId: formData.value.customerId, customerName: formData.value.customerName, customerPhone: formData.value.customerPhone,
                items: validItems, notes: formData.value.notes.filter(n => n.note.trim() !== ''), categoryDiscounts: formData.value.categoryDiscounts,
                additionalDiscount: formData.value.additionalDiscount || 0, additionalDiscountType: formData.value.additionalDiscountType,
                finalAmount: totals.value.finalAmount, totalDiscount: totals.value.totalDiscount, taxAmount: formData.value.taxAmount || 0
            };

            let savedEstimateId = formData.value.id;

            try {
                if(isDemoMode.value) {
                    await new Promise(r => setTimeout(r, 600));
                    if(formMode.value === 'create') {
                        savedEstimateId = estimates.value.length + 1;
                        estimates.value.unshift({ id: savedEstimateId, estimateNumber: `EST-100${savedEstimateId}`, customerName: payload.customerName, customerPhone: payload.customerPhone, finalTotal: payload.finalAmount, createdAt: new Date().toISOString(), items: payload.items, notes: payload.notes });
                    } else {
                        const idx = estimates.value.findIndex(e => e.id === formData.value.id);
                        if(idx !== -1) estimates.value[idx] = { ...estimates.value[idx], customerName: payload.customerName, finalTotal: payload.finalAmount, items: payload.items };
                    }
                } else {
                    if(formMode.value === 'create') {
                        const res = await apiFetch(`/api/business/${businessInfo.value.id}/estimates`, { method: 'POST', body: JSON.stringify(payload) });
                        savedEstimateId = res.id;
                    } else {
                        await apiFetch(`/api/estimates/${formData.value.id}`, { method: 'PUT', body: JSON.stringify(payload) });
                    }
                    await loadEstimates(); // Refresh list and stats from backend
                }
                
                if (shouldPrint === true) {
                    saving.value = false;
                    if (isDemoMode.value) {
                        await nextTick();
                        window.print();
                    } else {
                        await printEstimate({ id: savedEstimateId });
                    }
                }

                view.value = 'dashboard'; currentTab.value = 'estimates';
            } catch(e) { errorMsg.value = e.message || "Failed to save estimate."; }
            finally { saving.value = false; }
        };

        const deleteEstimate = (id) => {
            openConfirm("Delete Estimate", "Are you sure you want to delete this estimate? This action cannot be undone.", async () => {
                try {
                    if(!isDemoMode.value) {
                        await apiFetch(`/api/estimates/${id}`, { method: 'DELETE' });
                        await loadEstimates();
                    } else {
                        estimates.value = estimates.value.filter(e => e.id !== id);
                    }
                } catch(e) { showMessage("Failed to delete: " + e.message, true); }
            });
        };

        const printEstimate = async (est) => {
            if (isDemoMode.value) {
                window.print();
                return;
            }
            
            try {
                // Fetch the PDF using the secure fetch wrapper to handle auth cookies
                const res = await authenticatedFetch(`/api/estimates/${est.id}/pdf`, {
                    method: 'GET'
                });
                
                if (!res.ok) {
                    throw new Error(`HTTP Error ${res.status}: Failed to generate PDF`);
                }
                
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                
                // 1. Safely Download the PDF
                const link = document.createElement('a');
                link.href = url;
                link.target = '_blank';
                link.download = `Estimate-${est.estimateNumber || est.id}.pdf`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                // 2. Open System Print Dialog via hidden iframe
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = url;
                document.body.appendChild(iframe);
                iframe.onload = () => {
                    iframe.contentWindow.focus();
                    iframe.contentWindow.print();
                };

                // Cleanup
                setTimeout(() => {
                    window.URL.revokeObjectURL(url);
                    if(document.body.contains(iframe)) document.body.removeChild(iframe);
                }, 60000);
            } catch (e) {
                showMessage("Failed to load PDF: " + e.message, true);
            }
        };

        const isMobileDevice = () => /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
        const shareEstimate = async (est) => {
            if (isDemoMode.value) {
                showMessage("Sharing is simulated in Demo Mode.", false);
                return;
            }
            
            try {
                const shareLinkResponse = await apiFetch(`/api/estimates/${est.id}/share-link`);
                const pdfUrl = shareLinkResponse.url;
                const fileName = `Estimate-${est.estimateNumber || est.id}.pdf`;
                const textMsg = `Hello ${est.customerName || ''}, here is your estimate ${est.estimateNumber || ''} for ${formatCurrency(est.finalTotal)}.`;
                const whatsappMessage = `${textMsg} Check this file: ${pdfUrl}`;
                let phone = '';
                if (est.customerPhone) {
                    phone = est.customerPhone.replace(/[^\d+]/g, '');
                    if (phone.startsWith('+')) phone = phone.substring(1);
                }
                const whatsappUrl = phone
                    ? `https://wa.me/${phone}?text=${encodeURIComponent(whatsappMessage)}`
                    : `https://wa.me/?text=${encodeURIComponent(whatsappMessage)}`;

                if (isMobileDevice()) {
                    const res = await fetch(pdfUrl, {
                        method: 'GET'
                    });

                    if (!res.ok) {
                        throw new Error(`HTTP Error ${res.status}: Failed to generate PDF`);
                    }

                    const blob = await res.blob();

                    if (navigator.share && navigator.canShare) {
                        const file = new File([blob], fileName, { type: 'application/pdf' });
                        if (navigator.canShare({ files: [file] })) {
                            try {
                                await navigator.share({
                                    files: [file],
                                    title: `Estimate ${est.estimateNumber || est.id}`,
                                    text: textMsg
                                });
                                return;
                            } catch (e) {
                                console.log("Share dialog was cancelled or failed.", e);
                            }
                        }
                    }

                    const url = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = fileName;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    window.open(whatsappUrl, '_blank');
                    setTimeout(() => window.URL.revokeObjectURL(url), 10000);
                    showMessage("Native file sharing is unavailable on this device. WhatsApp will open with a message and link; attach the downloaded PDF manually if needed.", false);
                    return;
                }

                window.open(whatsappUrl, '_blank');
                showMessage("Desktop WhatsApp can only send text and a link. Download and attach the PDF manually if you need to send the file itself.", false);
            } catch (e) {
                showMessage("Failed to share PDF: " + e.message, true);
            }
        };

        // Lifecycle Hooks
        onMounted(() => {
            // Initial script load fallback
            let attempts = 0;
            const initIconsInterval = setInterval(() => {
                if (window.lucide) {
                    clearInterval(initIconsInterval);
                    updateIcons();
                } else if (attempts++ > 50) clearInterval(initIconsInterval);
            }, 100);

            // Automatically render icons for dynamically injected elements
            const observer = new MutationObserver(() => updateIcons());
            observer.observe(document.body, { childList: true, subtree: true });

            checkSession();
        });
        
        watch(currentTab, (newTab) => {
            if(newTab === 'catalog') { loadCategories(); selectedCategoryId.value = null; products.value = []; }
        });

        return {
            isInitializing, isDemoMode, showSettings, apiBaseUrl, view, authMode, currentTab, loading, loadingCat, loadingProd, saving, errorMsg, successMsg, isAuthenticated, isAdmin, confirmDialog,
            credentials, signupData, businessInfo, hasBusinessProfile, businessFormData, isEditingProfile, estimates, serverStats, categories, products, availableProducts, groupedAvailableProducts, activeCategoriesInItems,
            selectedCategoryId, selectedCategoryName, newCategoryName, showAddProduct, newProduct, formData, formMode, totals, searchQuery, filteredEstimates, dashboardStats,
            toggleSettings, signup, login, logout, saveBusiness, handleLogoUpload, loadEstimates, loadCategories, createCategory, selectCategory, createProduct, deleteProduct,
            openCreateForm, openEditForm, addItem, removeItem, addNote, removeNote, addCategoryDiscount, removeCategoryDiscount,
            onProductSelect, hasActiveCategoryDiscount, getCategoryDiscountForProduct, saveEstimate, deleteEstimate, printEstimate, shareEstimate, formatCurrency, formatDate, calculateRowTotal,
            openConfirm, closeConfirm, confirmAction
        };
    }
}).mount('#app');
</script>
